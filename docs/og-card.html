<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#fbf9f5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Nanum Myeongjo', serif;
  position:relative;
}
body::before{
  content:"";position:absolute;inset:26px;
  border:1px solid #e2dbcc;
}
body::after{
  content:"";position:absolute;inset:33px;
  border:1px solid #efe9dc;
}
img{width:132px;margin-bottom:30px}
.kicker{
  font-family:'Apple SD Gothic Neo',sans-serif;
  font-size:20px;font-weight:700;letter-spacing:.16em;
  color:#157a63;margin-bottom:26px;
}
h1{
  font-size:66px;font-weight:800;color:#1c2a25;
  letter-spacing:-.025em;line-height:1.3;text-align:center;
}
h1 span{display:block;font-size:.55em;font-weight:400;color:#57665f;margin-top:12px;letter-spacing:0}
.sub{
  font-size:26px;color:#a8874f;margin-top:30px;text-align:center;line-height:1.6;
}
.date{
  margin-top:34px;padding-top:26px;border-top:1px solid #e2dbcc;
  font-size:30px;font-weight:700;color:#1c2a25;letter-spacing:-.02em;
  display:flex;align-items:center;gap:16px;
}
.date .dot{width:4px;height:4px;border-radius:50%;background:#a8874f;display:inline-block}
.date .place{font-size:26px;font-weight:400;color:#57665f}
</style>
</head>
<body>
  <img src="logo.png" alt="">
  <p class="kicker">마뗄암재단 말기암환자 무료쉼터</p>
  <h1>「가브리엘라 천사의 집」<span>축복미사</span></h1>
  <p class="sub">이 땅에서는 마지막 집, 천국에서는 첫 번째 집</p>
  <p class="date">
    2026. 9. 17. 목 오전 11시
    <span class="dot"></span>
    <span class="place">인천 강화</span>
  </p>
</body>
</html>
