<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#fbf9f5;font-family:'Nanum Myeongjo',serif;display:flex;flex-direction:column}

.pic{height:352px;width:100%;overflow:hidden;position:relative;flex:none}
.pic img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.pic::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(to bottom, rgba(251,249,245,0), #fbf9f5);
}

.txt{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 40px 22px;position:relative;
}
.kicker{
  font-family:'Apple SD Gothic Neo',sans-serif;
  font-size:17px;font-weight:700;letter-spacing:.16em;color:#157a63;margin-bottom:14px;
}
h1{
  font-size:56px;font-weight:800;color:#1c2a25;
  letter-spacing:-.03em;line-height:1.2;text-align:center;
}
h1 em{font-style:normal;font-weight:400;color:#57665f;font-size:.62em;margin-left:14px;letter-spacing:-.01em}
.date{
  margin-top:20px;padding-top:18px;border-top:1px solid #ddd5c4;
  font-size:27px;font-weight:700;color:#1c2a25;letter-spacing:-.02em;
  display:flex;align-items:center;gap:15px;
}
.date .dot{width:4px;height:4px;border-radius:50%;background:#a8874f}
.date .place{font-size:24px;font-weight:400;color:#57665f}
</style>
</head>
<body>
  <div class="pic"><img src="og-bg.jpg" alt=""></div>
  <div class="txt">
    <p class="kicker">마뗄암재단 말기암환자 무료쉼터</p>
    <h1>가브리엘라 천사의 집<em>축복미사</em></h1>
    <p class="date">
      2026. 9. 17. 목 오전 11시
      <span class="dot"></span>
      <span class="place">인천 강화</span>
    </p>
  </div>
</body>
</html>
